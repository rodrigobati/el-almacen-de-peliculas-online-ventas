name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23 (Temurin) and enable Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: "maven"

      - name: Build and run unit tests
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B -ntp -Dspring.profiles.active=test test
          else
            mvn -B -ntp -Dspring.profiles.active=test test
          fi
