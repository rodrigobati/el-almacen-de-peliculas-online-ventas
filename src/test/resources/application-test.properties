# Test profile properties (used by integration tests via -Dspring.profiles.active=test)
# Minimal RabbitMQ and datasource settings so integration tests can start using Testcontainers

rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.compras.events.exchange=ventas.events.test
rabbitmq.compras.events.routingkey=ventas.events.test.key
rabbitmq.compras.compra.confirmada.routing-key=ventas.compra.confirmada.test.key
rabbitmq.ventas.events.exchange=ventas.events.test
rabbitmq.catalogo.stock.validation.requested.routing-key=catalogo.stock.validation.requested.test
rabbitmq.descuentos.exchange=descuentos.exchange
rabbitmq.descuentos.cupon.validar.queue=descuentos.cupon.validar.queue
rabbitmq.descuentos.cupon.validar.routing-key=descuentos.cupon.validar
rabbitmq.descuentos.cupon.validar.timeout-ms=5000

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

ventas.outbox.scheduler.enabled=false
ventas.outbox.max-attempts=3
ventas.outbox.retry.base-delay-ms=1

# H2 test datasource used by tests (in-memory)
spring.datasource.url=jdbc:h2:mem:ventasdb-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Disable external services by default in tests
ventas.catalogo.base-url=http://localhost:8081
ventas.catalogo.page-size=200
ventas.bootstrap.internal-token=test-bootstrap-token

# Defaults for RabbitMQ keys used by app annotations/config so tests don't fail
rabbitmq.event.movie.queue.name=movie.events.queue
rabbitmq.ventas.dlx.exchange=ventas.dlx.exchange
rabbitmq.ventas.retry.exchange=ventas.retry.exchange
rabbitmq.ventas.stock.rechazado.queue=ventas.stock.rechazado.queue
rabbitmq.ventas.stock.rechazado.retry.queue=ventas.stock.rechazado.retry.queue
rabbitmq.ventas.stock.rechazado.retry.routing-key=ventas.stock.rechazado.retry
rabbitmq.ventas.stock.rechazado.retry.ttl-ms=5000
rabbitmq.ventas.stock.rechazado.dlq.queue=ventas.stock.rechazado.dlq
rabbitmq.ventas.stock.rechazado.dlq.routing-key=ventas.stock.rechazado.dlq
rabbitmq.catalogo.stock.rechazado.routing-key=catalogo.stock.rechazado
rabbitmq.ventas.stock.validation.accepted.queue=ventas.stock.validation.accepted.queue
rabbitmq.catalogo.stock.validation.accepted.routing-key=catalogo.stock.validation.accepted
rabbitmq.ventas.stock.validation.accepted.retry.queue=ventas.stock.validation.accepted.retry.queue
rabbitmq.ventas.stock.validation.accepted.retry.routing-key=ventas.stock.validation.accepted.retry
rabbitmq.ventas.stock.validation.accepted.retry.ttl-ms=5000
rabbitmq.ventas.stock.validation.accepted.dlq.queue=ventas.stock.validation.accepted.dlq
rabbitmq.ventas.stock.validation.accepted.dlq.routing-key=ventas.stock.validation.accepted.dlq
rabbitmq.ventas.stock.validation.accepted.max-retries=3
